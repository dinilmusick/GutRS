name: GutRS Rust Contract CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    name: Portable contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Install native Cactus libc++ dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Portable core build without cloud features
        run: cargo check --no-default-features
      - name: Contract unit and integration tests
        run: cargo test --all-targets --all-features
      - name: Documentation tests
        run: cargo test --doc --all-features
      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile and execute standalone external consumer
        run: cargo run --manifest-path examples/external-consumer/Cargo.toml

  upstream-differential:
    name: Pinned GutTS differential (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GutRS exact PR commit
        uses: actions/checkout@v4
      - name: Checkout immutable upstream source
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: 3e2cbc0990ba29830ce91c5d1a1d552675d5334c
          path: upstream
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install exact upstream dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Build unmodified upstream source
        working-directory: upstream
        run: pnpm run build
      - name: Rust toolchain for independent metadata comparison
        uses: dtolnay/rust-toolchain@stable
      - name: Export public Rust metadata and FOD registry
        run: cargo run --quiet --example export_registry > rust-registry.json
      - name: Execute same golden cases against actual upstream
        run: node scripts/check-upstream-golden.mjs
      - name: Compare all 33 portable API operations with pinned TypeScript execution
        run: |
          cargo run --quiet --example export_utility_cases > rust-utility-results.json
          node scripts/check-utility-api-differential.mjs
          cargo run --quiet --example export_ettin_heads > rust-ettin-head.json
          node scripts/check-ettin-head-differential.mjs

  native-cactus-live:
    name: Actual on-device Needle3 and Whistle inference (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Link Cactus static engine with Linux C++ standard library
        run: sudo apt-get update -qq && sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Execute real pinned-weights Cactus CPU inference
        run: cargo test --features cactus-native --test native_cactus_live -- --ignored --nocapture

  native-minilm-live:
    name: Actual all-MiniLM-L6-v2 ONNX inference (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Load pinned MiniLM weights and run real ONNX CPU inference
        run: cargo test --features minilm-native --test native_minilm_live -- --ignored --nocapture

  native-ettin-live:
    name: Actual Ettin 17M reranker inference (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute exact Ettin 17M ONNX CPU reranking
        run: cargo test --features ettin-native --test native_ettin_live -- --ignored --nocapture

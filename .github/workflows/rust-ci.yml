name: GutRS Rust Contract CI
on:
  push:
    branches: [main, feat/gutts-core-utility-parity-20261118, 'wave1/gutrs-parity-20261120-gpt6']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    name: Portable contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Contract unit and integration tests
        run: cargo test --all-targets --all-features
      - name: Documentation tests
        run: cargo test --doc --all-features
      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile and execute standalone external consumer
        run: cargo run --manifest-path examples/external-consumer/Cargo.toml

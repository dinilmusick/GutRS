[package]
name = "gutrs"
version = "0.2.0"
edition = "2021"
description = "Native Rust contracts for pinned GutTS portable utilities and identity"
license = "MIT"
repository = "https://github.com/dinilmusick/GutRS"

[lib]
path = "src/lib.rs"

[dependencies]
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"], optional = true }
google-drive3 = { version = "=7.0.0", optional = true }

url = "2.5"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heck = "0.5"
email_address = "0.2"
unicode-normalization = "0.1"
regex = "1"

# Hosted SDK adapters are optional; default builds remain portable and credential-free.
[features]
default = []
aws-s3 = ["dep:aws-sdk-s3"]
google-drive = ["dep:google-drive3"]

[package]
name = "gutrs"
version = "0.2.0"
edition = "2021"
description = "Native Rust contracts for pinned GutTS portable utilities and identity"
license = "MIT"
repository = "https://github.com/dinilmusick/GutRS"

[lib]
path = "src/lib.rs"

[dependencies]
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls", "behavior-version-latest"], optional = true }
google-drive3 = { version = "=7.0.0", optional = true }

url = "2.5"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heck = "0.5"
email_address = "0.2"
unicode-normalization = "0.1"
regex = "1"
fastembed = { version = "=7.7.1", default-features = false, features = ["onnx", "hf-hub"], optional = true }
base64 = "0.22"

# Hosted SDK adapters are optional; default builds remain portable and credential-free.
[features]
default = []
aws-s3 = ["dep:aws-sdk-s3"]
google-drive = ["dep:google-drive3"]
# Native Cactus engine is supported only on Linux x86_64 and macOS arm64.
cactus-native = ["dep:cactus-rs"]
minilm-native = ["dep:fastembed"]

[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
cactus-rs = { version = "=0.2.1", optional = true }
